# Tool Registry — Vol II Ch13, Vol VII Ch5.
# Planner references tools by name here, never hard-coded commands.

tools:
  - name: diff_requests
    category: verification
    version: "1.0"
    description: >
      Fetches two requests and diffs the response: status code, content length,
      and body content. This is the standard IDOR/BOLA verification step —
      request the SAME endpoint identifying two DIFFERENT objects/users and
      compare. Matching status code + different body content is the concrete
      evidence of unauthorized cross-user data access that nuclei's generic
      templates cannot detect on app-specific parameters. Use this INSTEAD of
      running nuclei again after nuclei returns 0 matches on an IDOR
      hypothesis — nuclei only matches known signatures, it cannot test "does
      identifying a different record leak someone else's data," which is what
      diff_requests is for.
      CHECK WHETHER THE IDENTIFIER IS A GET QUERY PARAM OR A POST FORM FIELD
      BEFORE ASSUMING GET — many endpoints, including Mutillidae's
      view-someones-blog.php specifically, take the identifier as a POST form
      field, not a URL query parameter (its field is named "author"). Sending
      it as a GET query-string append (default) will NOT reach the real
      content — you'll get the same generic page back for every value and
      wrongly conclude "not vulnerable" or "no effect from this parameter."
      For a POST-based identifier: set url_a and url_b to the SAME endpoint
      URL with NO query string, set method to "POST", and put the actual
      differing values in data_a/data_b as a full
      application/x-www-form-urlencoded body, e.g. data_a=
      "author=admin&view-someones-blog-php-submit-button=View+Blog+Entries",
      data_b="author=samurai&view-someones-blog-php-submit-button=View+Blog+Entries".
    # Deploy scripts/kali_tools/diff_requests.py to this exact path on the
    # Kali VM first (see script's own docstring). Fetches url_a and url_b
    # (GET) or POSTs data_a/data_b to them (POST), diffs status/body — this
    # is the actual comparison IDOR verification needs (request as one
    # identity, request as another, diff), done as one atomic tool call
    # instead of reconstructed across cycles from two separate summaries.
    # method/data_a/data_b are unconditionally in the template with safe
    # GET defaults — the script itself ignores data_a/data_b whenever
    # method != POST (see its own main()), so passing empty strings for a
    # plain GET call is a no-op, not a real POST body.
    command_template: "python3 /home/kali/agent_tools/diff_requests.py {url_a} {url_b} --method {method} --data-a {data_a} --data-b {data_b}"
    input_schema: { url_a: "string", url_b: "string", method: "string", data_a: "string", data_b: "string" }
    default_params: { method: "GET", data_a: "-", data_b: "-" }
    output_schema: { format: "json" }
    risk_level: low
    timeout: 30
    dependencies: []

  - name: httpx
    category: recon
    version: "latest"
    description: >
      Sends a single HTTP request to a URL and returns status code,
      headers, and full response body (via -irr). Use for probing one
      specific endpoint/parameter value at a time — e.g. checking what a
      single tampered parameter returns. For comparing two parameter
      values against each other (the actual IDOR test), use diff_requests
      instead — it does both requests and the comparison in one call.
    command_template: "/home/kali/go/bin/httpx -u {target} -json -irr"
    input_schema: { target: "string" }
    output_schema: { format: "json_lines" }
    risk_level: low
    timeout: 60
    dependencies: []

  - name: katana
    category: discovery
    version: "latest"
    description: >
      Crawls a target and enumerates reachable URLs/endpoints. Use early,
      to discover what pages/parameters exist, before deciding which
      specific endpoint to test for a vulnerability class.
    command_template: "/home/kali/go/bin/katana -u {target} -jc -d 3"
    input_schema: { target: "string" }
    output_schema: { format: "text_lines" }
    risk_level: low
    timeout: 300
    dependencies: []

  - name: arjun
    category: discovery
    version: "latest"
    description: >
      Discovers hidden/undocumented HTTP parameters on an endpoint by
      brute-forcing common parameter names. Use when an endpoint's visible
      parameters don't reveal an obvious IDOR vector but the app likely
      accepts an id/user_id/record_id-style parameter it isn't advertising.
    # Unlike nmap's -oX -, arjun's -oJ/-o does NOT special-case "-" as
    # stdout — it's argparse dest='json_file', a plain file path (confirmed
    # against arjun/__main__.py). "-oJ -" was silently writing results to
    # a file literally named "-" in the CWD every run; stdout only ever
    # had the banner + "Processing chunks: N/M" progress spinner, which is
    # why every single-run summary came back "(output not valid JSON)"
    # regardless of what arjun actually found. Fix: write to a real temp
    # file, cat it back onto stdout (which is what the SSH channel
    # captures), then clean up — while still propagating arjun's own exit
    # code (via $rc) rather than cat/rm's, so a genuine arjun failure
    # still shows up as status=failed instead of being masked by the
    # cleanup commands succeeding. arjun's own stderr is left unredirected
    # (only its stdout banner is silenced) so real errors are still
    # visible in exec_result.stderr on failure.
    command_template: "f=$(mktemp); arjun -u {target} -oJ $f >/dev/null; rc=$?; cat $f 2>/dev/null; rm -f $f; exit $rc"
    input_schema: { target: "string" }
    output_schema: { format: "json" }
    risk_level: low
    timeout: 180
    dependencies: []

  - name: nuclei
    category: scanning
    version: "latest"
    description: >
      Runs signature-based vulnerability templates against a target.
      Good for known CVEs, misconfigurations, exposed panels, default
      credentials — anything with a matchable signature. NOT suitable for
      app-specific IDOR/BOLA (e.g. "does user_id=2 return someone else's
      data") since that requires comparing two live responses, which no
      generic template does. If an IDOR/BOLA hypothesis already returned
      0 matches once, re-running nuclei with different tags/severity on
      the same hypothesis is unlikely to help — use diff_requests instead.
    command_template: "nuclei -u {target} -jsonl -severity {severity} -tags {tags}"
    input_schema: { target: "string", severity: "string", tags: "string" }
    default_params: { severity: "medium,high,critical", tags: "auth,login,jwt,oauth,idor,exposure" }
    output_schema: { format: "json_lines" }
    risk_level: medium
    timeout: 600
    dependencies: []

  - name: nmap
    category: scanning
    version: "latest"
    description: >
      Full port scan with service/version detection. Use for initial
      recon of a host's attack surface (open ports, running services) —
      not useful for testing a specific web-app logic flaw like IDOR once
      the target endpoint is already known.
    command_template: "nmap -sV -p- {target} -oX -"
    input_schema: { target: "string" }
    output_schema: { format: "xml" }
    risk_level: medium
    timeout: 900
    dependencies: []

  - name: sqlmap
    category: validation
    version: "latest"
    description: >
      Automated SQL injection detection/exploitation. Only use when
      reasoning strongly supports a SQLi hypothesis specifically (e.g. a
      parameter reflecting DB errors) — not a general-purpose scanner and
      not relevant to IDOR/authorization testing.
    command_template: "sqlmap -u {target} --batch --level=1 --risk=1"
    input_schema: { target: "string" }
    output_schema: { format: "text" }
    risk_level: high   # requires approval — only when reasoning strongly supports SQLi
    timeout: 900
    dependencies: []