# Scope & Rules — Vol V Ch3. Nothing runs until this is parsed and honored.

program_name: "local-lab"

in_scope:
  - "192.168.56.101"
  - "http://192.168.56.101"
  - "http://192.168.56.101/mutillidae"
  - "http://192.168.56.101/mutillidae/index.php?page=view-someones-blog.php"
  # Wildcard variant of the line above — needed because fnmatch has no
  # concept of "same URL, different query params" otherwise: with only the
  # exact literal line above, fnmatch degrades to plain string equality
  # (no '*'/'?'/'[...]' in the pattern), so ANY tampered version of this
  # URL — including the &user_id=1 / &user_id=2 variants that IDOR
  # verification via diff_requests fundamentally requires comparing — was
  # being rejected by scope regardless of how correctly the model built
  # it. This keeps scope anchored to the same specific endpoint (nothing
  # else on the host becomes newly in-scope) while allowing the query
  # string after it to vary, which is the entire point of testing IDOR.
  - "http://192.168.56.101/mutillidae/index.php?page=view-someones-blog.php*"
  # Broadened from the single blog-page wildcard above: the stated goal
  # explicitly includes credit card records, which necessarily live on a
  # DIFFERENT page under Mutillidae (e.g. page=view-someones-cc.php-style
  # endpoints) — the narrower wildcard was blocking exploration of the
  # very second half of the goal it was scoped for. Anchored to Mutillidae
  # specifically (page=* under this exact script), not the whole host —
  # katana's crawl also surfaced dvwa/, twiki/, and dav/ on the same VM,
  # none of which are part of the stated goal and none of which this
  # pattern covers.
  - "http://192.168.56.101/mutillidae/index.php?page=*"
  - "192.168.56.104"

out_of_scope: []

# Local-lab ground truth — facts about THIS specific engagement that no
# amount of crawled security knowledge (OWASP/PortSwigger via
# knowledge_collector) could ever contain, because they're not general
# methodology, they're this install's actual seed data. Session 35 spent a
# full cycle "confirming" no IDOR on view-someones-blog.php using
# author=admin/user1 — neither of which has seeded blog content in
# Mutillidae's default DB, so identical responses were guaranteed
# regardless of whether the parameter is exploitable. Listed here (not
# buried in a tool description) so it surfaces in the # Scope section of
# every prompt, not just when the model happens to read
# tools_registry.yaml's diff_requests entry closely.
#
# USAGE NOTE (added after session 36): each entry has a username/password
# pair because that's how these accounts are documented, but that does
# NOT mean a login step is required to use them. On view-someones-blog.php
# specifically, the username alone is the vulnerable POST parameter value
# (author=<username>) — no session/cookie needed. Session 36 wasted 3
# cycles trying to log in first because a username+password pair reads as
# "credentials to authenticate with." Try the username directly as a
# parameter value FIRST; only attempt an actual login if a direct
# unauthenticated request is demonstrably rejected (401/403/login
# redirect) for a specific endpoint.
#
# These are Mutillidae's well-documented default seeded accounts. If this
# lab instance was reseeded/customized, update this list to match — the
# agent will test whatever is listed here as fact, it cannot verify it.
known_credentials:
  - username: "samurai"
    password: "samurai"
    note: "has seeded blog posts — try as author=samurai directly on view-someones-blog.php first, no login required for that endpoint"
  - username: "john"
    password: "monkey"
    note: "has seeded blog posts — try as author=john directly, no login required for that endpoint"
  - username: "jason"
    password: "junkfood"
    note: "has seeded blog posts — try as author=jason directly, no login required for that endpoint"
  - username: "admin"
    password: "admin"
    note: "admin account — often has no/different blog content than regular users; do not treat identical responses against admin alone as a negative result"

forbidden_techniques:
  - "denial_of_service"
  - "automated_spam"
  - "physical_attacks"
  - "social_engineering"

rate_limit:
  requests_per_second: 5

time_constraints:
  engagement_start: null
  engagement_end: null

reporting_requirements:
  platform: "generic"   # hackerone | bugcrowd | generic