# Scope & Rules — Vol V Ch3. Nothing runs until this is parsed and honored.

program_name: "local-lab"

in_scope:
  - "192.168.56.101"
  - "http://192.168.56.101"
  - "http://192.168.56.101/mutillidae"
  # Primary target: login/authentication endpoint and its query variants.
  - "http://192.168.56.101/mutillidae/index.php?page=login.php*"
  # Other Mutillidae pages are in scope because authentication/session
  # testing may require password-reset, logout, protected-page, or
  # session-management endpoints discovered during the engagement.
  # CONFIRMED (2026-08-11): goal_manager.is_in_scope() checks each pattern
  # with fnmatch.fnmatch(target, pattern), so this single wildcard already
  # matches login.php, password-reset pages, logout, and any other
  # index.php?page=<x> endpoint — no separate entries needed per-page for
  # the auth/session-management session.
  - "http://192.168.56.101/mutillidae/index.php?page=*"


out_of_scope: []

# Local-lab ground truth — facts about THIS specific engagement that no
# amount of crawled security knowledge (OWASP/PortSwigger via
# knowledge_collector) could ever contain, because they're not general
# methodology, they're this install's actual seed data. Session 35 spent a
# full cycle "confirming" no IDOR on view-someones-blog.php using
# author=admin/user1 — neither of which has seeded blog content in
# Mutillidae's default DB, so identical responses were guaranteed
# regardless of whether the parameter is exploitable. Listed here (not
# buried in a tool description) so it surfaces in the # Scope section of
# every prompt, not just when the model happens to read
# tools_registry.yaml's diff_requests entry closely.
#
# USAGE NOTE (added after session 36): each entry has a username/password
# pair because that's how these accounts are documented, but that does
# NOT mean a login step is required to use them. On view-someones-blog.php
# specifically, the username alone is the vulnerable POST parameter value
# (author=<username>) — no session/cookie needed. Session 36 wasted 3
# cycles trying to log in first because a username+password pair reads as
# "credentials to authenticate with." Try the username directly as a
# parameter value FIRST; only attempt an actual login if a direct
# unauthenticated request is demonstrably rejected (401/403/login
# redirect) for a specific endpoint.
#
# These are Mutillidae's well-documented default seeded accounts. If this
# lab instance was reseeded/customized, update this list to match — the
# agent will test whatever is listed here as fact, it cannot verify it.
known_credentials:
  - username: "samurai"
    password: "samurai"
    note: "has seeded blog posts — try as author=samurai directly on view-someones-blog.php first, no login required for that endpoint"
  - username: "john"
    password: "monkey"
    note: "has seeded blog posts — try as author=john directly, no login required for that endpoint"
  - username: "jason"
    password: "junkfood"
    note: "has seeded blog posts — try as author=jason directly, no login required for that endpoint"
  - username: "admin"
    password: "admin"
    note: "admin account — often has no/different blog content than regular users; do not treat identical responses against admin alone as a negative result"

# Auth/session-management ground truth (added 2026-08-11, before the
# authentication/session_management-focused session) — same rationale as
# known_credentials above: facts about this specific install that no
# amount of crawled OWASP/PortSwigger methodology would contain.
#
# - Mutillidae's session cookie is named "PHPSESSID" (standard PHP
#   default, not renamed). Some legacy/older Mutillidae pages also gate
#   access on a separate "uid" cookie rather than validating solely
#   against the server-side session — check for both when testing
#   auth-bypass-via-cookie-manipulation hypotheses, not just PHPSESSID.
# - This install has NO account lockout mechanism by design — it's one of
#   Mutillidae's intentional vulnerabilities. A "does repeated failed
#   login trigger lockout" hypothesis should be driven to a REJECTED
#   verdict once several failed attempts don't produce a block/delay, not
#   left at needs_more_evidence expecting a lockout to eventually appear.
session_auth_ground_truth:
  session_cookie_name: "PHPSESSID"
  secondary_auth_cookie: "uid"
  account_lockout_present: false

# URL structure ground truth (added 2026-08-15) — this has now cost FOUR
# wasted retry-cycles across two sessions (view-someones-blog.php twice,
# profile.php twice): the model's reasoning about WHAT to test was
# correct each time, but it guessed the URL as a direct file path instead
# of Mutillidae's actual routing convention, got scope-blocked, and had
# to burn a full extra cycle to self-correct. Stated directly so it
# doesn't need to be re-derived (or re-failed) every time a new page name
# comes up.
url_structure_ground_truth:
  correct_pattern: "http://192.168.56.101/mutillidae/index.php?page=<page-name>.php"
  wrong_pattern_example: "http://192.168.56.101/mutillidae/<page-name>.php"
  note: >
    EVERY Mutillidae page — login.php, profile.php, view-someones-blog.php,
    reset-password.php, all of them — is reached through
    index.php?page=<name>.php. A direct path like /mutillidae/profile.php
    is NOT how this app routes and will be blocked as out-of-scope. Before
    constructing a URL for any new page name, apply this pattern first —
    do not guess a direct path.

# Lab setup ground truth (added 2026-08-16, corrected 2026-08-16) —
# session 41 repeatedly hit a "Table 'metasploit.accounts' doesn't exist"
# SQL error on profile.php across multiple cycles (both before and after
# running set-up-database.php). The FIRST theory — that this was simply
# the DB never being initialized — was WRONG and cost additional cycles
# before being disproven: set-up-database.php was confirmed to run
# cleanly every time (all queries return result 1, no PHP/MySQL errors),
# yet the error persisted immediately afterward.
#
# ROOT CAUSE (confirmed via direct shell access to the target,
# 192.168.56.101, msfadmin@metasploitable): a real config bug on this VM
# image. set-up-database.php creates a database named `owasp10`
# (CREATE DATABASE owasp10; — see the script itself), but
# /var/www/mutillidae/config.inc had `$dbname = 'metasploit';` hardcoded
# — pointing the live application at a completely different, unrelated
# database that never contained Mutillidae's tables. This was a one-time
# provisioning defect on this specific VM (likely from mixing a
# Metasploitable2 base image with a separately-installed Mutillidae that
# never had its config updated), NOT an application vulnerability, and
# NOT something re-running the DB reset could ever have fixed.
#
# FIX APPLIED (2026-08-16, on the target directly): config.inc's
# $dbname changed from 'metasploit' to 'owasp10' to match what
# set-up-database.php actually creates. Verified post-fix: profile.php
# returns real content with no database error for both uid=admin and
# other cookie values. As of this fix, the error is RESOLVED AT THE
# SOURCE — it is not expected to recur under normal operation.
lab_setup_ground_truth:
  db_setup_page: "http://192.168.56.101/mutillidae/index.php?page=set-up-database.php"
  wrong_reset_page_example: "http://192.168.56.101/mutillidae/index.php?page=reset-db.php"
  historical_error_now_fixed: "Table 'metasploit.accounts' doesn't exist"
  fix_applied: "config.inc $dbname corrected from 'metasploit' to 'owasp10' on the target VM, 2026-08-16"
  note: >
    The "Table 'metasploit.accounts' doesn't exist" error that appeared
    repeatedly in earlier sessions has been root-caused and fixed
    directly on the target (a database-name mismatch in config.inc,
    now corrected). It is NOT expected to occur again. If it DOES
    reappear in a future cycle, do NOT assume it's the old known
    non-finding and suppress it — treat it as a genuine regression
    worth investigating (e.g. the VM reverted to a snapshot, or the
    fix didn't persist), since the underlying fix was applied outside
    this agent's own action history and could theoretically be undone
    by external factors like a VM snapshot restore. Do not, however,
    treat a single unexplained occurrence of this exact error as a
    confirmed SQL injection or IDOR finding on its own — a raw
    "table doesn't exist" error is infrastructure-level, not evidence
    of a parameter controlling data access, regardless of cause.

forbidden_techniques:
  - "denial_of_service"
  - "automated_spam"
  - "physical_attacks"
  - "social_engineering"

rate_limit:
  requests_per_second: 5

time_constraints:
  engagement_start: null
  engagement_end: null

reporting_requirements:
  platform: "generic"   # hackerone | bugcrowd | generic