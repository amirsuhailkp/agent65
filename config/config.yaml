# Agent Cyber — Configuration
# Vol VI Ch6: LLM, VM connection, tool paths, database, logging, resource limits, report templates

llm:
  # Fast model — drives the hot loop (hypothesis generation, per-cycle
  # reasoning, decisions). Runs every cycle, so this should fully fit in
  # VRAM with no CPU offload for speed and to keep thermals down.
  #
  # context_window history (2026-08-16): this was previously 8192. That
  # value was set when num_ctx wasn't actually being read by
  # OllamaClient (a real bug, since fixed) — so 8192 was harmless on
  # paper but never took effect; every call silently ran on Ollama's own
  # small default context instead. Once that bug was fixed and num_ctx
  # actually started applying, 8192 became a real problem: on a 4GB VRAM
  # card, qwen3:4b's weights alone (~2.5GB at Q4) leave very little
  # headroom, and an 8192-token KV cache doesn't fit in what's left —
  # forcing partial spillover to system RAM. That's the direct cause of
  # the 10-20 minute per-call latency and 95%+ RAM warnings seen through
  # every session since. Lowered to 3072: still comfortably covers a
  # single cycle's prompt (goal + scope + a handful of hypotheses/
  # experiences), while actually fitting in VRAM. If you see prompts
  # getting truncated (check for missing context in model output) before
  # RAM pressure eases, that's the sign to trim prompt CONTENT (fewer
  # relevant_experiences, shorter scope notes) rather than raising this
  # back up — raising it back toward 8192 will reproduce the same
  # spillover.
  provider: ollama
  host: "http://127.0.0.1:11434"
  model: "qwen3:4b"
  context_window: 3072
  temperature: 0.2
  max_retries: 3
  backoff_base_seconds: 2

llm_deep:
  # Escalation model — only called by ImpactAssessor (src/reasoning/
  # impact_assessor.py) to judge whether a finding shows clear, real
  # impact. Rare by design (gated by verification.min_confidence_for_deep_review
  # below), so the heavier model is worth the extra latency/heat here.
  #
  # IMPORTANT hardware note: qwen3:8b's weights alone are ~5GB at Q4 —
  # this ALREADY exceeds a 4GB VRAM budget before any context is
  # allocated. Unlike the llm/qwen3:4b case above, no context_window
  # value will make this model fully fit in VRAM on this hardware; it
  # will always run partially on CPU. Lowering context_window here still
  # helps (less KV cache competing for the little VRAM headroom that
  # does exist, so what's on GPU actually helps), but the achievable
  # floor on latency for this specific model on this specific card is
  # meaningfully higher than qwen3:4b's, and no config change removes
  # that — it needs either a smaller/more aggressively quantized model,
  # or better hardware, to fix properly. Lowered to 2048 here as a
  # reasonable trim given ImpactAssessor's prompt is scoped to one
  # finding's evidence, not the full session backlog.
  provider: ollama
  host: "http://127.0.0.1:11434"
  model: "qwen3:8b"
  context_window: 2048
  temperature: 0.1   # this is a judgment call, not a creative one
  max_retries: 3
  backoff_base_seconds: 2

llm_learning:
  # Playbook Learning Engine ONLY (src/learning/) — offline, infrequent,
  # runs over already-collected/already-public knowledge docs. Never used
  # by the hot loop, DecisionEngine, or ImpactAssessor's live-evidence
  # judgment — those stay on llm/llm_deep above (local Ollama), on purpose.
  #
  # provider: "ollama" (default, same as llm_deep) or "cloud" (any
  # OpenAI-compatible endpoint, e.g. a local FreeLLMAPI instance).
  provider: cloud
  base_url: "http://localhost:3001/v1"   # FreeLLMAPI's local OpenAI-compatible endpoint
  model: "auto"                          # "auto" = let FreeLLMAPI route to its best available model
  api_key_env: "FREELLMAPI_API_KEY"     # key is read from this env var, NOT stored here
  temperature: 0.1
  max_retries: 3
  backoff_base_seconds: 2
  # To go back to local-only, just set provider: ollama and add
  # host/model fields like llm_deep above — no code changes needed.

kali_vm:
  host: "192.168.56.105"   # host-only adapter IP (eth1) — confirmed reachable
  ssh_port: 22
  ssh_user: "kali"
  ssh_key_path: "C:/Users/hp/.ssh/id_ed25519"
  connect_timeout: 10
  command_timeout: 300

database:
  sqlite_path: "data/agent_cyber.db"
  vector_db_path: "data/chroma"
  vector_collection: "knowledge_base"

knowledge_collector:
  # DO NOT rebuild — existing completed, tested subsystem.
  # settings.py: processed_directory = <collector_root>/processed (no "storage/" subfolder)
  root_path: "F:/agent-cyber/knowledge_collector"
  processed_output_path: "F:/agent-cyber/knowledge_collector/processed"

logging:
  level: "INFO"
  log_dir: "logs"
  rotate_mb: 20
  retain_files: 10

resources:
  gpu_temp_warn_c: 75
  gpu_temp_pause_c: 82
  vram_warn_pct: 90
  ram_warn_pct: 90
  cpu_warn_pct: 85
  cpu_pause_pct: 95
  cooldown_seconds: 60
  poll_interval_seconds: 15

scope:
  scope_file: "config/scope.yaml"

reporting:
  templates_dir: "src/reporting/templates"
  reports_dir: "reports"
  export_formats: ["markdown", "json", "html"]

session:
  checkpoint_interval_seconds: 120
  max_retry_per_hypothesis: 3

verification:
  # Below this hypothesis confidence (or if the tool run didn't complete),
  # ImpactAssessor skips the deep-model call entirely and clear_impact
  # stays False — keeps the expensive model rare, not per-cycle.
  min_confidence_for_deep_review: 0.5

learning:
  # Playbook Learning Engine (src/learning/). Not fine-tuning — builds
  # structured knowledge/playbooks the planner consults, LLM stays the
  # reasoning engine. See Claude_Playbook_Learning_Engine_Update.md.
  min_observations_for_confidence_growth: 2  # below this, confidence is hard-capped
  confidence_delta_for_new_version: 0.05     # min confidence shift that forces a new playbook version
  # Documents matching these (title/category, case-insensitive substring)
  # get processed FIRST out of a large backlog, so playbooks for your
  # actual focus area exist early instead of waiting behind unrelated
  # documents. Only reorders the queue — never skips/excludes anything.
  priority_keywords:
    - "auth"
    - "session"
    - "logic"
    - "idor"
    - "bola"
    - "privilege"
    - "access control"
    - "token"
    - "jwt"
    - "sso"
    - "oauth"